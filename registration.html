<!DOCTYPE html>
<html>
    <link rel="stylesheet" href="form.css"
<head>
    <title>Farmer Registration Form</title>


</head>

<body>

<h2>Farmer Registration Form</h2>

<form id="farmerForm">

    <fieldset>
        <legend>Farmer Details</legend>

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name" autofocus>
        <span id="nameError" class="error"></span>
        <br><br>

        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile"
               placeholder="Enter 10-digit mobile number">
        <span id="mobileError" class="error"></span>
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"
               placeholder="example@gmail.com">
        <span id="emailError" class="error"></span>
        <br><br>

        <label for="plotid">Plot ID:</label><br>
        <input type="text" id="plotid" name="plotid"
               placeholder="Enter Plot ID">
        <span id="plotidError" class="error"></span>
        <br><br>

        <label for="village">Village:</label><br>
        <input type="text" id="village" name="village"
               placeholder="Enter Village Name">
        <span id="villageError" class="error"></span>
        <br><br>

        <label for="cropstage">Crop Stage:</label><br>
        <select id="cropstage" name="cropstage">
            <option value="">Select Crop Stage</option>
            <option>Seedling</option>
            <option>Vegetative</option>
            <option>Flowering</option>
            <option>Harvesting</option>
        </select>
        <span id="cropstageError" class="error"></span>
        <br><br>

        <label for="soil">Soil Type:</label><br>
        <select id="soil" name="soil">
            <option value="">Select Soil Type</option>
            <option>Clay</option>
            <option>Sandy</option>
            <option>Loamy</option>
            <option>Silty</option>
        </select>
        <span id="soilError" class="error"></span>
        <br><br>

        <label for="irrigation">Irrigation Method:</label><br>
        <select id="irrigation" name="irrigation">
            <option value="">Select Irrigation Method</option>
            <option>Drip Irrigation</option>
            <option>Sprinkler Irrigation</option>
            <option>Flood Irrigation</option>
        </select>
        <span id="irrigationError" class="error"></span>
        <br><br>

        <label for="soilmoisture">Soil Moisture (%):</label><br>
        <input type="number" id="soilmoisture"
               name="soilmoisture"
               placeholder="Percentage"
               min="0" max="100">
        <span id="soilmoistureError" class="error"></span>
        <br><br>

        <label for="date">Registration Date:</label><br>
        <input type="date" id="date" name="date">
        <span id="dateError" class="error"></span>
        <br><br>

        <label for="photo">Farm Photo:</label><br>
        <input type="file" id="photo" name="photo">
        <span id="photoError" class="error"></span>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </fieldset>

</form>


<script>

const form = document.getElementById("farmerForm");



function validateName() {

    let name = document.getElementById("name").value.trim();
    let error = document.getElementById("nameError");
    let field = document.getElementById("name");

    let namePattern = /^[A-Za-z ]+$/;

    if (name === "") {
        error.textContent = "Name cannot be empty.";
        field.classList.add("invalid");
        return false;
    }

    if (!namePattern.test(name)) {
        error.textContent =
            "Name must contain alphabets and spaces only.";
        field.classList.add("invalid");
        return false;
    }

    error.textContent = "";
    field.classList.add("valid");
    return true;
}


function validateMobile() {

    let mobile = document.getElementById("mobile").value.trim();
    let error = document.getElementById("mobileError");
    let field = document.getElementById("mobile");

    let mobilePattern = /^[6-9][0-9]{9}$/;

    if (!mobilePattern.test(mobile)) {
        error.textContent =
            "Enter a valid 10-digit Indian mobile number.";
        field.classList.add("invalid");
        return false;
    }

    error.textContent = "";
    field.classList.add("valid");
    return true;
}


function validateEmail() {

    let email = document.getElementById("email").value.trim();
    let error = document.getElementById("emailError");
    let field = document.getElementById("email");

    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        error.textContent = "Enter a valid email address.";
        field.classList.add("invalid");
        return false;
    }

    error.textContent = "";
    field.classList.add("valid");
    return true;
}


function validatePlotId() {

    let plotid = document.getElementById("plotid").value.trim();
    let error = document.getElementById("plotidError");
    let field = document.getElementById("plotid");

    if (plotid === "") {
        error.textContent = "Plot ID cannot be empty.";
        field.classList.add("invalid");
        return false;
    }

    error.textContent = "";
    field.classList.add("valid");
    return true;
}


function validateVillage() {

    let village = document.getElementById("village").value.trim();
    let error = document.getElementById("villageError");
    let field = document.getElementById("village");

    if (village === "") {
        error.textContent = "Village cannot be empty.";
        field.classList.add("invalid");
        return false;
    }

    error.textContent = "";
    field.classList.add("valid");
    return true;
}


function validateCropStage() {

    let value = document.getElementById("cropstage").value;
    let error = document.getElementById("cropstageError");
    let field = document.getElementById("cropstage");

    if (value === "") {
        error.textContent = "Please select crop stage.";
        field.classList.add("invalid");
        return false;
    }

    error.textContent = "";
    field.classList.add("valid");
    return true;
}


function validateSoil() {

    let value = document.getElementById("soil").value;
    let error = document.getElementById("soilError");
    let field = document.getElementById("soil");

    if (value === "") {
        error.textContent = "Please select soil type.";
        field.classList.add("invalid");
        return false;
    }

    error.textContent = "";
    field.classList.add("valid");
    return true;
}



function validateIrrigation() {

    let value = document.getElementById("irrigation").value;
    let error = document.getElementById("irrigationError");
    let field = document.getElementById("irrigation");

    if (value === "") {
        error.textContent = "Please select irrigation method.";
        field.classList.add("invalid");
        return false;
    }

    error.textContent = "";
    field.classList.add("valid");
    return true;
}


function validateSoilMoisture() {

    let value = document.getElementById("soilmoisture").value;
    let error = document.getElementById("soilmoistureError");
    let field = document.getElementById("soilmoisture");

    if (value === "" || Number(value) < 0 || Number(value) > 100) {

        error.textContent =
            "Enter soil moisture between 0 and 100.";

        field.classList.add("invalid");
        return false;
    }

    error.textContent = "";
    field.classList.add("valid");
    return true;
}


function validateDate() {

    let date = document.getElementById("date").value;
    let error = document.getElementById("dateError");
    let field = document.getElementById("date");

    let today = new Date().toISOString().split("T")[0];

    if (date === "") {
        error.textContent = "Registration date is required.";
        field.classList.add("invalid");
        return false;
    }

    if (date > today) {
        error.textContent =
            "Future registration dates are not allowed.";
        field.classList.add("invalid");
        return false;
    }

    error.textContent = "";
    field.classList.add("valid");
    return true;
}


function validatePhoto() {

    let photo = document.getElementById("photo").value;
    let error = document.getElementById("photoError");
    let field = document.getElementById("photo");

    if (photo === "") {
        error.textContent = "Please upload a farm photo.";
        field.classList.add("invalid");
        return false;
    }

    error.textContent = "";
    field.classList.add("valid");
    return true;
}



form.addEventListener("submit", function(event) {

    event.preventDefault();

   
    document.querySelectorAll("input, select").forEach(function(field) {
        field.classList.remove("invalid");
        field.classList.remove("valid");
    });

  
    let valid = true;

    if (!validateName()) valid = false;
    if (!validateMobile()) valid = false;
    if (!validateEmail()) valid = false;
    if (!validatePlotId()) valid = false;
    if (!validateVillage()) valid = false;
    if (!validateCropStage()) valid = false;
    if (!validateSoil()) valid = false;
    if (!validateIrrigation()) valid = false;
    if (!validateSoilMoisture()) valid = false;
    if (!validateDate()) valid = false;
    if (!validatePhoto()) valid = false;


  
    if (valid) {

        alert("Farmer Registration Successful!");
        
        window.location.href = "mpp.html";

        document.querySelectorAll("input, select").forEach(function(field) {
            field.classList.remove("valid");
            field.classList.remove("invalid");
        });
    }
    else {

        alert("Please correct the errors before submitting.");

    }

});



form.addEventListener("reset", function() {

    setTimeout(function() {

        document.querySelectorAll(".error").forEach(function(error) {
            error.textContent = "";
        });

        document.querySelectorAll("input, select").forEach(function(field) {
            field.classList.remove("valid");
            field.classList.remove("invalid");
        });

    }, 0);

});

</script>

</body>
</html>
